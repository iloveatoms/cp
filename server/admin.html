<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myna API</title>
  <style>
 /* ===== RESET ===== */
* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

/* ===== BODY ===== */
body {
  margin: 0;
  background: #020617;
  color: #ecfdf5;
  overflow-x: hidden;
}

/* ===== HEADERS ===== */
h1 {
  color: #ecfdf5;
  margin: 20px 0 5px;
}

h3 {
  color: #34d399;
  letter-spacing: 2px;
}

/* ===== NAV BUTTONS ===== */
.nav {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 20px;
}

.nav button {
  background: #022c22;
  color: #d1fae5;
  border: 1px solid #064e3b;
  padding: 10px 24px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.nav button:hover {
  background: #10b981;
  color: #022c22;
}

.nav button:active {
  transform: scale(0.95);
}

/* ===== CONTAINER ===== */
#container {
  width: 100%;
  padding: 10px;
  overflow-x: auto;
}

/* ===== TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
  background: #020617;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
}

/* ===== TABLE HEADERS ===== */
.field {
  background: #022c22;
  color: #34d399;
  font-weight: bold;
  cursor: pointer;
}

.field:hover {
  background: #064e3b;
  color: #ecfdf5;
}

/* ===== TABLE CELLS ===== */
.value {
  color: #d1fae5;
}

/* ===== ROW HOVER ===== */
.row:hover .value {
  background: #022c22;
}

/* ===== BORDERS & PADDING ===== */
.field,
.value {
  border: 1px solid #064e3b;
  padding: 10px;
  text-align: center;
  white-space: nowrap;
}

/* ===== SCROLLBAR ===== */
#container::-webkit-scrollbar {
  height: 8px;
}

#container::-webkit-scrollbar-thumb {
  background: #10b981;
  border-radius: 8px;
}

#container::-webkit-scrollbar-track {
  background: #020617;
}

  </style>
</head>
<body>
  <h1 style='text-align:center;font-size:50px;font-family:sans-serif'>Myna API</h1>
  <h3 style='text-align:center;font-size:15px;font-family:monospace;color:blue'>ADMIN DASHBOARD</h3>

  <hr style="margin: 5px 10px 20px;border:2px solid rgb(70, 92, 161);">

  <div class="nav">
    <button id="issues"> Issues </button>
    <button id="users">  Users  </button>
  </div>

  <div id="container">
  </div>

  <script>
    const dbUrl = "/";
    const container = document.getElementById("container");
    let headers, rows;
    let sortDirection = {};

    function sortField(e){

      field = e.target.id;
      pos = headers.indexOf(field);

      const fact = sortDirection[field] ? -1*sortDirection[field] : 1;

      sortDirection[field] = fact;

      if (typeof rows[0][pos] === "string"){
        rows.sort( (a,b) => { return fact*(a[pos].localeCompare(b[pos])); } );
      }else if (typeof rows[0][pos] === "number"){
        rows.sort( (a,b) => { return fact*(a[pos] - b[pos] )  } );
      }

      createTable(headers,rows);
    }

    async function getData(action, table, data){
      const response = await fetch(dbUrl, {
        method: "POST",
        headers : {'Content-Type':'application/json'},
        body : JSON.stringify(
          {
            action : action,
            table : table,
            ...data
          }
        )
      });

      if (response.ok){
        const resp = await response.json();
        return resp
      }
      else{
        console.error(response.error);
      }
    }

    function createTable(fields, rows){
      table = document.createElement('table');
      table.id = "table";

      fieldRow = table.insertRow();
      fieldRow.className = "fields"
      for(let i=0; i<fields.length;i++){
        let ihead = fieldRow.insertCell();
        ihead.id = fields[i];
        ihead.className = "field";
        ihead.innerHTML = fields[i];

        ihead.onclick = sortField;
      }

      for(let i=0; i<rows.length; i++){
        let irow = table.insertRow();
        irow.id = "row" + i;
        irow.className = "row";

        for(let j=0; j<fields.length; j++){
          let icell = irow.insertCell();
          icell.id = irow.id + ':' + j;
          icell.className = "value";
          icell.innerHTML = rows[i][j];
        }
      }

     container.innerHTML = "";
     container.appendChild(table);
    }


    getData("SELECT","user",{}).then(
      (res)=>{
        if (res.status === "success")
        {
          headers = res.headers;
          rows = res.rows;
          createTable(res.headers, res.rows);
        }
        else{ document.body.innerHTML += "status : " + res.status; }
      }
    )
  </script>
</body>
</html>
