<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myna - Admin Dashboard</title>
<style>
 /* ===== RESET ===== */
* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

/* ===== BODY ===== */
body {
  margin: 0;
  background: #020617;
  color: #ecfdf5;
  overflow-x: hidden;
}

/* ===== HEADERS ===== */
h1 {
  pointer-events: none;
  color: #ecfdf5;
  margin: 20px 0 5px;
}

h3 {
  pointer-events: none;
  color: #34d399;
  letter-spacing: 2px;
}

/* ===== NAV BUTTONS ===== */
.nav {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 20px;
}

.nav button {
  background: #022c22;
  color: #d1fae5;
  border: 1px solid #064e3b;
  padding: 10px 24px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.nav button.active {
  background: #10b981;
  color: #022c22;
  box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
}
.nav button:hover {
  background: #10b981;
  color: #022c22;
}

.nav button:active {
  transform: scale(0.95);
}

/* ===== CONTAINER ===== */
#container {
  width: 100%;
  padding: 10px;
  overflow-x: auto;
}

/* ===== TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
  background: #020617;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
}

/* ===== TABLE HEADERS ===== */
.field {
  user-select: none;
  background: #022c22;
  color: #34d399;
  font-weight: bold;
  cursor: pointer;
}

.field:hover {
  background: #064e3b;
  color: #006eff;
}

/* ===== TABLE CELLS ===== */
.value {
  color: #d1fae5;
}

/* ===== ROW HOVER ===== */
.row:hover {
  background: #1c2c026c;
}

/* ===== BORDERS & PADDING ===== */
.field,
.value {
  border: 1px solid #064e3b;
  padding: 10px;
  text-align: center;
  white-space: nowrap;
}
/* ===== BROWSER SCROLLBAR (GREEN THEME) ===== */

/* Chrome, Edge, Safari */
::-webkit-scrollbar {
  width: 10px;
}

::-webkit-scrollbar-track {
  background: #020617;
}

::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #10b981, #34d399);
  border-radius: 10px;
  border: 2px solid #020617;
}

::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, #059669, #10b981);
}

/* Firefox */
* {
  scrollbar-width: thin;
  scrollbar-color: #10b981 #020617;
}

.gradient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(
    circle at var(--x, 50%) var(--y, 50%),

    /* micro core */
    rgba(0, 180, 255, 1) 0px,
    rgba(0, 180, 255, 0.9) 1.5px,

    /* tiny transition */
    rgba(0, 255, 180, 0.6) 3px,
    rgba(0, 255, 180, 0.35) 4.5px,

    /* soft fade */
    rgba(0, 255, 180, 0.15) 6px,
    rgba(0, 255, 180, 0.05) 8px,

    transparent 10px
  );
  transition: background 0.03s linear;
  filter: blur(1.5px);
}
</style>
</head>
<body>
  <div class="gradient"></div>
  <h1 style='text-align:center;font-size:50px;font-family:sans-serif'>Myna</h1>
  <h3 style='text-align:center;font-size:15px;font-family:monospace;color:blue'>ADMIN DASHBOARD</h3>

  <hr style="margin: 5px 10px 20px;border:2px solid rgb(70, 92, 161);">

  <div class="nav">
    <button id="user" onclick="updateTables(this)">  Users  </button>
    <button id="post" onclick="updateTables(this)"> Issues </button>
  </div>

  <div id="container">
  </div>

<script>
  const dbUrl = "/";
  const container = document.getElementById("container");

  const tables = [];
  const sortDirection = {};
  const statusRank = {
    "": 0,
    "underReview": 1,
    "reviewed": 2,
    "rejected": 3
  };


  document.addEventListener("mousemove", (e) => {
    const x = (e.clientX / window.innerWidth) * 100;
    const y = (e.clientY / window.innerHeight) * 100;
    document.documentElement.style.setProperty("--x", `${x}%`);
    document.documentElement.style.setProperty("--y", `${y}%`);
  });

  function formatUnixHint(unix) {
    if (!unix || isNaN(unix)) return unix;

    // If number > 10^12, assume milliseconds
    const timestamp = unix > 1e12 ? unix : unix * 1000;

    const d = new Date(timestamp);

    // Break out each part
    const year = `<span style="color:#34d399;font-weight:bold">${d.getFullYear()}</span>`;
    const month = `<span style="color:#60a5fa;font-weight:bold">${d.getMonth() + 1}</span>`;
    const day = `<span style="color:#facc15;font-weight:bold">${d.getDate()}</span>`;
    const hours = `<span style="color:#f472b6;font-weight:bold">${d.getHours()}</span>`;
    const minutes = `<span style="color:#fb923c;font-weight:bold">${d.getMinutes()}</span>`;
    const seconds = `<span style="color:#a78bfa;font-weight:bold">${d.getSeconds()}</span>`;

    // Combine parts
    const formatted = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

    return `
      <div>${unix}</div>
      <div style="font-size:11px;opacity:0.8">${formatted}</div>
    `;
  }

function attachImagePopup(link) {
  let popup;
  let hideTimeout;

  const showPopup = () => {
    if (hideTimeout) clearTimeout(hideTimeout);
    if (popup) return; // already visible

    popup = document.createElement("div");
    Object.assign(popup.style, {
      position: "fixed",
      background: "#020617",
      padding: "5px",
      border: "1px solid #064e3b",
      borderRadius: "6px",
      zIndex: 9999,
      boxShadow: "0 0 10px rgba(0,0,0,0.5)",
      display: "flex",
      flexDirection: "column",
      alignItems: "flex-start",
      maxWidth: "300px",
    });

    const rect = link.getBoundingClientRect();
    const viewportHeight = window.innerHeight;
    const popupHeight = 220; // img max-height 200 + padding + copy button
    let top = rect.bottom;
    if (rect.bottom + popupHeight > viewportHeight) {
      // flip above link if not enough space
      top = rect.top - popupHeight;
      if (top < 0) top = 5; // clamp to top
    }

    Object.assign(popup.style, {
      top: top + "px",
      left: rect.left + "px",
    });

    const img = document.createElement("img");
    img.src = link.href;
    Object.assign(img.style, {
      maxWidth: "100%",
      maxHeight: "200px",
      borderRadius: "4px",
      marginBottom: "4px",
    });

    const copyBtn = document.createElement("span");
    copyBtn.textContent = "Copy Image";
    Object.assign(copyBtn.style, {
      cursor: "pointer",
      fontSize: "12px",
      color: "#34d399",
      userSelect: "none",
    });

    copyBtn.onclick = async (e) => {
    e.stopPropagation();

    try {
      const response = await fetch(link.href);
      let blob = await response.blob();

      // 🔥 FIX: normalize MIME type
      if (blob.type === "application/octet-stream") {
        const ext = link.href.split(".").pop().toLowerCase();

        let mime = "image/png"; // safe default
        if (ext === "jpg" || ext === "jpeg") mime = "image/jpeg";
        else if (ext === "webp") mime = "image/webp";
        else if (ext === "gif") mime = "image/gif";

        blob = blob.slice(0, blob.size, mime);
      }

      await navigator.clipboard.write([
        new ClipboardItem({ [blob.type]: blob })
      ]);

      copyBtn.textContent = "✅ Copied!";
      setTimeout(() => (copyBtn.textContent = "Copy Image"), 1000);

    } catch (err) {
      console.error(err);
      copyBtn.textContent = "❌ Failed";
      setTimeout(() => (copyBtn.textContent = "Copy Image"), 1000);
    }
  };


    popup.appendChild(img);
    popup.appendChild(copyBtn);
    document.body.appendChild(popup);

    popup.onmouseenter = () => { if (hideTimeout) clearTimeout(hideTimeout); };
    popup.onmouseleave = () => { hidePopup(); };
  };

  const hidePopup = () => {
    hideTimeout = setTimeout(() => {
      if (popup) {
        popup.remove();
        popup = null;
      }
    }, 200);
  };

  link.onmouseenter = showPopup;
  link.onmouseleave = hidePopup;
}




function renderStatusSelector(td, currentStatus, row, tableObj) {
  const postIdIndex = tableObj.fields.indexOf("postid");
  const statusDateIndex = tableObj.fields.indexOf("statusDate");

  const postid = row[postIdIndex];
  const oldStatus = currentStatus;

  const select = document.createElement("select");
  select.style.background = "#020617";
  select.style.color = "#d1fae5";
  select.style.border = "1px solid #064e3b";
  select.style.borderRadius = "4px";
  select.style.padding = "2px 4px";

  ["", "reviewed", "rejected", "underReview"].forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v || "—";
    if (v === currentStatus) opt.selected = true;
    select.appendChild(opt);
  });

  select.onchange = async () => {
    const newStatus = select.value;

    // optimistic disable
    select.disabled = true;

    const res = await getData("UPDATE", "post", {
      postid,
      status: newStatus,
      statusDate: Date.now()
    });

    if (res && res.status === "success") {
      // update row data
      row[tableObj.fields.indexOf("status")] = newStatus;
      row[statusDateIndex] = Date.now();

      // update statusDate cell visually
      const statusDateCell = td.parentElement.cells[statusDateIndex];
      statusDateCell.innerHTML = formatUnixHint(row[statusDateIndex]);
    } else {
      // rollback
      select.value = oldStatus;
    }

    select.disabled = false;
  };

  td.appendChild(select);
}



function renderMeta(value) {
  if (!value) return "";

  try {
    const obj = typeof value === "string" ? JSON.parse(value) : value;

    return `<pre style="
      margin:0;
      text-align:left;
      font-size:12px;
      line-height:1.4;
      color:#d1fae5;
      white-space:pre-wrap;
      max-width:420px;
    ">${JSON.stringify(obj, null, 2)}</pre>`;
  } catch {
    return `<span style="color:#f87171">${value}</span>`;
  }
}

function makeCellCopyable(td, raw) {
  td.style.position = "relative";

  const icon = document.createElement("span");
  icon.innerHTML = "📋";
  Object.assign(icon.style, {
    position: "absolute",
    top: "2px",
    right: "4px",
    fontSize: "12px",
    color: "#34d399",
    opacity: "0",
    transition: "opacity 0.2s",
    cursor: "pointer",
    userSelect: "none",
  });

  icon.onclick = (e) => {
    e.stopPropagation();
    navigator.clipboard.writeText(String(raw));
    icon.innerHTML = "✅";
    setTimeout(() => (icon.innerHTML = "📋"), 800);
  };

  td.onmouseenter = () => (icon.style.opacity = "1");
  td.onmouseleave = () => (icon.style.opacity = "0");

  td.appendChild(icon);
}



function sortField(e) {
  const field = e.target.id;
  const tableEl = e.target.closest("table");
  const tableObj = tables.find(t => t.ele === tableEl);
  if (!tableObj) return;

  const pos = tableObj.fields.indexOf(field);
  const dir = sortDirection[field] ? -sortDirection[field] : 1;
  sortDirection[field] = dir;

  tableObj.rows.sort((a, b) => {
    if (typeof a[pos] === "number") {
      return dir * (a[pos] - b[pos]);
    }
    return dir * a[pos].toString().localeCompare(b[pos].toString());
  });

  renderTable(tableObj);
}

  async function getData(action, table, data = {}) {
    const response = await fetch(dbUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action : action, table : table, ...data })
    });
    return response.ok ? response.json() : null;
  }

  async function updatePost(postid, status){
    await getData("UPDATE", "post", {
      postid : postid,
      status : status,
      statusDate : Date.now()
    });
  }

  function renderTable(tableObj) {
    tableObj.ele.innerHTML = "";

    const headerRow = tableObj.ele.insertRow();
    tableObj.fields.forEach(f => {
      const cell = headerRow.insertCell();
      cell.className = "field";
      cell.id = f;
      cell.textContent = f;
      cell.onclick = sortField;
    });

    tableObj.rows.forEach((row, i) => {
      const tr = tableObj.ele.insertRow();
      tr.className = "row";
      row.forEach((val, idx) => {
          const td = tr.insertCell();
          td.className = "value";
          const fieldName = tableObj.fields[idx];

          if (fieldName === "dateOfCreation" || fieldName === "statusDate") { td.innerHTML = formatUnixHint(val); }
          else if (fieldName === "meta") { td.innerHTML = renderMeta(val); }
          else if (fieldName === "imageUrl") {
            const link = document.createElement("a");
            link.href = val;               // raw image URL
            link.textContent = val;
            link.target = "_blank";        // can still open full image in new tab if needed
            link.style.color = "#3b82f6";
            link.style.textDecoration = "underline";
            td.appendChild(link);
            attachImagePopup(link);
          }
          else if (fieldName === "status" && tableObj.ele.id === "table:post") {
            renderStatusSelector(td, val, row, tableObj);
            }
          else {
            td.textContent = val;
          }

          if (td.querySelector("select")) return;
          makeCellCopyable(td, val);
      });
    });
  }

  function createTable(fields, rows, tabID) {
    const table = document.createElement("table");
    table.id = "table:" + tabID;
    table.style.display = "none";

    const tableObj = { ele: table, fields, rows };
    tables.push(tableObj);

    renderTable(tableObj);
    container.appendChild(table);
  }



function normalizePostTable(headers, rows) {
  const metaIndex = headers.indexOf("meta");
  if (metaIndex === -1) return;

  // Inject columns AFTER meta
  headers.splice(metaIndex + 1, 0, "status", "statusDate");

  rows.forEach(row => {
    let status = "";
    let statusDate = "";

    try {
      const meta = typeof row[metaIndex] === "string"
        ? JSON.parse(row[metaIndex])
        : row[metaIndex];

      if (meta && typeof meta === "object") {
        status = meta.status ?? "";
        statusDate = meta.statusDate ?? "";

        // remove ONLY these keys
        delete meta.status;
        delete meta.statusDate;

        row[metaIndex] = JSON.stringify(meta);
      }
    } catch {
      // leave meta untouched on error
    }

    // Inject values to match headers
    row.splice(metaIndex + 1, 0, status, statusDate);
  });
}





  function fillTables() {
    ["user", "post"].forEach(v => {
      getData("SELECT", v).then(res => {
        if (res && res.status === "success") {
          if (v === "post") { normalizePostTable(res.headers, res.rows); }

          createTable(res.headers, res.rows, v);

          // show Post tab by default
          if (v === "post") {
            requestAnimationFrame(() => {
              updateTables(document.getElementById("post"));
            });
          }
        }
      });
    });
  }


  function updateTables(btn) {
    tables.forEach(t => {
      t.ele.style.display =
        t.ele.id === "table:" + btn.id ? "table" : "none";
    });

    document.querySelectorAll(".nav button").forEach(b =>
      b.classList.toggle("active", b === btn)
    );
  }

  fillTables();
</script>
</body>
</html>
